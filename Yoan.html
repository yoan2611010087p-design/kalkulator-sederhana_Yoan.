<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Operasi Bilangan</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff;
      color: #1d2939;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .calculator {
      width: min(100%, 560px);
      overflow: hidden;
      border: 1px solid #e5e9ef;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 55px rgb(34 56 84 / 10%);
    }

    .heading {
      padding: 28px 30px 24px;
      border-bottom: 1px solid #e9edf2;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #3974c6;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #192b43;
      font-size: clamp(26px, 5vw, 34px);
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 9px 0 0;
      color: #697789;
      font-size: 14px;
      line-height: 1.6;
    }

    .form-area {
      padding: 26px 30px 30px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #35465c;
      font-size: 13px;
      font-weight: 650;
    }

    input,
    select {
      width: 100%;
      min-height: 48px;
      padding: 0 13px;
      border: 1px solid #d9e0e8;
      border-radius: 9px;
      outline: none;
      background: #fff;
      color: #1d2939;
      font: inherit;
    }

    input::placeholder {
      color: #9aa5b3;
    }

    input:focus,
    select:focus {
      border-color: #3974c6;
      box-shadow: 0 0 0 3px rgb(57 116 198 / 13%);
    }

    .numbers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      min-height: 48px;
      padding: 0 18px;
      border: 1px solid transparent;
      border-radius: 9px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .calculate {
      flex: 1;
      background: #3974c6;
      color: #fff;
    }

    .calculate:hover {
      background: #2e62aa;
    }

    .clear {
      border-color: #d9e0e8;
      background: #fff;
      color: #536276;
    }

    .clear:hover {
      background: #f5f7fa;
    }

    .answer {
      margin-top: 22px;
      padding: 15px 17px;
      border-left: 4px solid #3974c6;
      border-radius: 8px;
      background: #f2f7fd;
    }

    .answer-label {
      display: block;
      margin-bottom: 6px;
      color: #63748a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    output {
      display: block;
      min-height: 30px;
      color: #1e4e88;
      font-size: 23px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .heading {
        padding: 23px 21px 20px;
      }

      .form-area {
        padding: 22px 21px 24px;
      }

      .numbers {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>
<body>
  <main class="calculator">
    <header class="heading">
      <p class="eyebrow">Belajar matematika</p>
      <h1>Operasi Bilangan</h1>
      <p class="subtitle">Pilih cara hitung dan masukkan bilangan yang ingin diproses.</p>
    </header>

    <section class="form-area" aria-label="Form operasi bilangan">
      <form id="calculator-form">
        <div class="field">
          <label for="operation">Jenis perhitungan</label>
          <select id="operation" name="operation">
            <option value="add">Penjumlahan (+)</option>
            <option value="subtract">Pengurangan (−)</option>
            <option value="multiply">Perkalian (×)</option>
            <option value="divide">Pembagian (÷)</option>
            <option value="power">Perpangkatan (xʸ)</option>
            <option value="remainder">Sisa pembagian (%)</option>
          </select>
        </div>

        <div class="numbers">
          <div class="field">
            <label for="first-number">Bilangan pertama</label>
            <input id="first-number" name="first-number" type="number" step="any" placeholder="Masukkan bilangan" required>
          </div>
          <div class="field">
            <label for="second-number">Bilangan kedua</label>
            <input id="second-number" name="second-number" type="number" step="any" placeholder="Masukkan bilangan" required>
          </div>
        </div>

        <div class="buttons">
          <button class="calculate" type="submit">Proses perhitungan</button>
          <button class="clear" type="reset">Kosongkan</button>
        </div>
      </form>

      <section class="answer" aria-live="polite" aria-atomic="true">
        <span class="answer-label">Jawaban</span>
        <output id="answer">Hasil akan ditampilkan di sini</output>
      </section>
    </section>
  </main>

  <script>
    const form = document.querySelector("#calculator-form");
    const operation = document.querySelector("#operation");
    const firstNumber = document.querySelector("#first-number");
    const secondNumber = document.querySelector("#second-number");
    const answer = document.querySelector("#answer");
    const numberFormat = new Intl.NumberFormat("id-ID", {
      maximumFractionDigits: 10
    });

    const calculations = {
      add: (a, b) => a + b,
      subtract: (a, b) => a - b,
      multiply: (a, b) => a * b,
      divide: (a, b) => a / b,
      power: (a, b) => a ** b,
      remainder: (a, b) => a % b
    };

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!form.reportValidity()) {
        return;
      }

      const a = Number(firstNumber.value);
      const b = Number(secondNumber.value);

      if (operation.value === "divide" && b === 0) {
        answer.textContent = "Bilangan pembagi tidak boleh nol.";
        return;
      }

      const result = calculations[operation.value](a, b);
      answer.textContent = Number.isFinite(result)
        ? numberFormat.format(result)
        : "Hasil tidak dapat ditampilkan.";
    });

    form.addEventListener("reset", () => {
      answer.textContent = "Hasil akan ditampilkan di sini";
    });
  </script>
</body>
</html>
